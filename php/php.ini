; =====================================================================
;  WordPress PHP tuning — mounted into conf.d (loaded last, overrides).
;  PHP .ini does NOT expand ${ENV} variables, so values are concrete.
;
;  This is the HEAVY profile: Elementor + WooCommerce on a server with
;  plenty of RAM. For smaller sites copy a lighter profile over this
;  file instead (the compose mount always reads php/php.ini):
;    cp php/php.ini.light.example  php/php.ini   # small blog / brochure
;    cp php/php.ini.medium.example php/php.ini   # mid-size WooCommerce
;  Then restart:  docker compose up -d wordpress
;
;  Importing a multi-GB Duplicator/WPvivid package needs limits far above
;  anything a running site should keep — those live in
;  php/php.ini.migration.example and are mounted only for the duration of
;  the migration (see MIGRATION.md).
; =====================================================================

; --- Uploads / memory / execution -----------------------------------
;  Elementor needs lots of memory + high max_input_vars (big page edits
;  POST hundreds of fields). WooCommerce imports need generous limits.
;  Upload size and execution time are bounded to production-sane values:
;  a 900s max_execution_time means one stuck request occupies a PHP worker
;  for 15 minutes, and enough of those exhausts the pool. Raise them
;  temporarily via the migration profile instead.
;  Keep upload_max_filesize/post_max_size BELOW Apache's LimitRequestBody
;  (apache/hardening.conf, 600 MB) so PHP produces the error, not Apache.
file_uploads           = On
memory_limit           = 1024M
upload_max_filesize    = 512M
post_max_size          = 512M
max_execution_time     = 300
max_input_time         = 300
max_input_vars         = 10000
max_file_uploads       = 50
default_socket_timeout = 120

; --- Errors (no output in prod, log to container stderr) ------------
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log              = /dev/stderr

; --- Mail (plugin-free SMTP via msmtp shim) -------------------------
;  wp_mail() -> PHP mail() -> this shim -> msmtp -> your SMTP relay.
;  Configured entirely from the SMTP_* env vars (see .env). With no
;  SMTP_HOST set the shim drops the message and logs a warning to the
;  container log (safe for local/dev, visible in production).
;  NOTE: every profile must set this — without it PHP falls back to
;  /usr/sbin/sendmail, which does not exist in the image, and all mail
;  fails. See MAIL.md.
sendmail_path          = "/usr/local/bin/wp-sendmail"

; --- Security -------------------------------------------------------
expose_php             = Off
allow_url_fopen        = On
allow_url_include      = Off
cgi.fix_pathinfo       = 0

; --- Realpath cache (big win for WP's many file includes) -----------
realpath_cache_size    = 4096k
realpath_cache_ttl     = 600

; --- OPcache --------------------------------------------------------
;  Elementor + Woo + their add-ons = tens of thousands of PHP files,
;  so give OPcache plenty of memory and file slots.
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 50000
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 2
opcache.save_comments           = 1
opcache.fast_shutdown           = 1
opcache.enable_file_override    = 0
opcache.huge_code_pages         = 1

; --- OPcache JIT (PHP 8.x) ------------------------------------------
;  OFF deliberately. WordPress request time is dominated by database and
;  I/O work, not by the tight numeric loops the JIT accelerates, so the
;  measurable gain on a real Woo/Elementor site is close to zero — while
;  the JIT has a track record of hard-to-diagnose segfaults with some
;  plugin/extension combinations, and the buffer costs RAM per worker.
;  Turn it on only if you have profiled a CPU-bound workload that needs it:
;    opcache.jit = tracing
;    opcache.jit_buffer_size = 128M
opcache.jit                     = off
opcache.jit_buffer_size         = 0
