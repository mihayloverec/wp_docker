# =====================================================================
#  Apache: always-on production config — mounted into conf-enabled.
#
#  This file is the DEFAULT posture: real client IPs behind the proxy,
#  bounded request limits, and the standard WordPress file-exposure
#  hardening. It is deliberately NOT tuned for importing a multi-GB
#  migration package — that needs limits which are unsafe to leave on
#  permanently, so they live in apache/migration.conf.example and are
#  mounted only while a migration is running (see MIGRATION.md).
# =====================================================================

# Suppress the "could not reliably determine the server's FQDN" warning.
ServerName localhost

# Don't advertise the exact Apache/PHP build in headers and error pages.
ServerTokens Prod
ServerSignature Off
# TRACE has no legitimate use here and enables cross-site tracing.
TraceEnable Off

# --- Real client IP behind a trusted reverse proxy ------------------
# mod_remoteip rewrites REMOTE_ADDR to the real client IP from
# X-Forwarded-For, but ONLY when the request actually comes from a trusted
# proxy — so other containers on the shared proxy network can't spoof it.
# TRUSTED_PROXY_CIDRS is injected from the environment (docker-compose.yml
# / .env); Apache expands ${VAR} from the process environment at startup.
# For best security narrow it to your edge proxy's exact subnet; the
# default trusts private ranges (the proxy is always a private container).
<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy ${TRUSTED_PROXY_CIDRS}
</IfModule>

# --- Request limits -------------------------------------------------
# Bounded on purpose. `LimitRequestBody 0` + a disabled body timeout (what
# the migration profile sets) let a single slow client hold a connection
# open indefinitely while streaming unlimited data — cheap slowloris and
# cheap disk-fill. 600 MB comfortably exceeds php.ini's post_max_size
# (512M) so PHP, not Apache, produces the error message users see.
LimitRequestBody 629145600
Timeout 120

<IfModule mod_reqtimeout.c>
    # Headers: 20s (40s if data keeps arriving). Body: 60s, extended while
    # the client sustains at least 500 bytes/s.
    RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=500
</IfModule>

# Keep-alive helps the many small asset requests Elementor pages make.
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5

# --- WordPress file exposure ----------------------------------------
# No directory listings anywhere under the docroot.
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Files that must never be fetchable over HTTP.
#   debug.log      — WP_DEBUG_LOG writes it INSIDE wp-content, i.e. inside
#                    the docroot: paths, SQL, sometimes tokens.
#   wp-config.php  — served as PHP normally, but if PHP ever stops handling
#                    .php (misconfig, module crash) this is the difference
#                    between an error page and leaking every credential.
#   readme.html /
#   license.txt    — advertise the exact WordPress version to scanners.
<FilesMatch "^(debug\.log|wp-config\.php|readme\.html|license\.txt)$">
    Require all denied
</FilesMatch>

# Dotfiles: .env, .git*, .htpasswd, editor leftovers.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Backup/editor leftovers that commonly sit next to real files.
<FilesMatch "\.(bak|old|orig|save|swp|sql|sql\.gz|tar|tar\.gz|zip)$">
    Require all denied
</FilesMatch>

# --- No PHP execution in writable upload paths ----------------------
# The single most valuable WordPress hardening rule: uploads/ is
# world-writable by design, so a file-upload vulnerability in any plugin
# turns into remote code execution the moment a .php there can be run.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?i:php|phtml|phps|phar|php[0-9])$">
        Require all denied
    </FilesMatch>
</Directory>

# --- xmlrpc.php: denied by default ----------------------------------
# Two well-known abuses: brute-forcing hundreds of passwords per request
# via system.multicall, and pingback-based DDoS amplification. Modern
# WordPress needs it for nothing.
#
# COMMENT THIS BLOCK OUT if you use the WordPress mobile app, Jetpack, or
# any tool that still speaks XML-RPC, then restart:
#   docker compose restart wordpress
<Files "xmlrpc.php">
    Require all denied
</Files>

# --- wp-cron.php: denied ---------------------------------------------
# This stack runs real cron in the wp-cron sidecar and sets DISABLE_WP_CRON,
# so the endpoint does nothing useful here — but it still boots all of
# WordPress on every hit, which makes it a cheap way for anyone to generate
# load. Nothing legitimate requests it in this setup.
<Files "wp-cron.php">
    Require all denied
</Files>

# --- Response headers -----------------------------------------------
# Cheap, broadly-compatible defaults. TLS/HSTS belongs on the edge proxy
# (it terminates HTTPS), so it is intentionally not set here.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Remove the header PHP adds naming its version (expose_php=Off in
    # php.ini covers this too; belt and braces).
    Header always unset X-Powered-By
</IfModule>
