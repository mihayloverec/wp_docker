# =====================================================================
#  OPT-IN overlay: keep passwords out of the container environment.
#
#  WHY
#  By default this stack passes MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD as
#  environment variables. That is convenient (and it is what Portainer's
#  Git-stack + .env workflow expects), but it means anyone who can read the
#  Docker API — `docker inspect`, the Portainer UI, any container with the
#  socket mounted — can read them in plain text.
#
#  This overlay switches to the official images' *_FILE convention, so the
#  values are read from files at startup and never appear in the container
#  environment at all.
#
#  ---------------------------------------------------------------------
#  SETUP
#
#  1) Create the secret files (0600, owned by root, NEVER committed —
#     ./secrets/ is git-ignored):
#
#       mkdir -p secrets && chmod 700 secrets
#       openssl rand -base64 24 | tr -d '\n' > secrets/db_password
#       openssl rand -base64 24 | tr -d '\n' > secrets/db_root_password
#       openssl rand -base64 24 | tr -d '\n' > secrets/redis_password
#       chmod 600 secrets/*
#
#     Note `tr -d '\n'`: a trailing newline becomes part of the password
#     for some readers and not others, which produces authentication
#     failures that are genuinely painful to debug.
#
#  2) Redis reads its password from a config file rather than the command
#     line (a --requirepass argument is visible in `ps`):
#
#       printf 'requirepass %s\n' "$(cat secrets/redis_password)" \
#         > secrets/redis.conf
#       chmod 600 secrets/redis.conf
#
#  3) Keep REDIS_PASSWORD in .env matching secrets/redis_password —
#     WordPress needs it in wp-config.php (see RESIDUAL below). The DB
#     passwords in .env become unused and should be emptied.
#
#  4) Deploy with BOTH files, every time:
#
#       docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
#     Or set it once in .env so plain `docker compose` picks it up:
#       COMPOSE_FILE=docker-compose.yml:docker-compose.secrets.yml
#
#  ---------------------------------------------------------------------
#  RESIDUAL EXPOSURE — what this does NOT fix
#
#  WORDPRESS_CONFIG_EXTRA still carries the Redis password, because
#  wp-config.php needs it as a literal and that env var is how it gets
#  written. So the Redis password remains visible in `docker inspect` and
#  in wp-config.php on the volume. That is a deliberate stopping point:
#  Redis is unreachable outside the private `internal` network, so its
#  password is a much lower-value secret than DB root — which this overlay
#  does remove. Closing that last gap means hand-maintaining a copy of the
#  whole config block here, where it would silently drift out of sync with
#  the real one; that trade is not worth it.
# =====================================================================

secrets:
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password
  redis_conf:
    file: ./secrets/redis.conf

services:
  db:
    environment:
      # Setting these to empty is how a value is "removed" in an overlay:
      # Compose merges environment maps, it cannot delete a key. The image
      # entrypoint treats an empty VAR as unset, so VAR_FILE is used and it
      # does not complain about the two being mutually exclusive.
      MARIADB_PASSWORD: ""
      MARIADB_ROOT_PASSWORD: ""
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password

  redis:
    # Config file first, CLI flags after — Redis applies them in order, so
    # the flags still win for everything except the password, which is only
    # ever in the file.
    command:
      - redis-server
      - /run/secrets/redis_conf
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    secrets:
      - redis_conf

  wordpress:
    environment:
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  wp-cron:
    environment:
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  backup:
    environment:
      MYSQL_PASSWORD: ""
      # backup.sh / restore.sh resolve *_FILE themselves (backup/lib.sh).
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
