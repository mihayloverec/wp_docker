# Ban action for traffic destined to CONTAINERS.
#
# THIS IS THE WHOLE REASON A CUSTOM ACTION IS NEEDED. fail2ban's stock actions
# insert into the INPUT chain, but packets heading for a published container
# port are DNAT'ed by Docker and traverse FORWARD, not INPUT. A ban in INPUT
# therefore does nothing at all — the jail looks healthy, reports bans, and
# the attacker keeps getting through.
#
# Docker provides the DOCKER-USER chain in the filter table specifically as a
# place for user rules that are consulted BEFORE its own, and that survive
# Docker rewriting its rules. So: create one chain per jail, hook it into
# DOCKER-USER, and add the drops there.
[Definition]

actionstart = iptables -N f2b-<name> 2>/dev/null || true
              iptables -A f2b-<name> -j RETURN 2>/dev/null || true
              iptables -I DOCKER-USER -j f2b-<name>

actionstop = iptables -D DOCKER-USER -j f2b-<name>
             iptables -F f2b-<name>
             iptables -X f2b-<name>

actioncheck = iptables -n -L DOCKER-USER | grep -q 'f2b-<name>[ \t]'

# Insert at position 1 so the drop is hit before the chain's RETURN.
actionban = iptables -I f2b-<name> 1 -s <ip> -j DROP

actionunban = iptables -D f2b-<name> -s <ip> -j DROP

[Init]
name = default
