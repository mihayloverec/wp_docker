# Matches the lines written by wordpress/mu-plugins/fail2ban-auth-log.php.
# Format (keep in sync with that file):
#   2026-07-25T12:34:56.123456Z wp-auth ip=203.0.113.9 event=login-failed user=admin
#
# The microseconds matter: fail2ban collapses failures sharing a timestamp, so
# with second resolution a burst of attempts inside one second counted as one.
[Definition]
# NOTE: fail2ban removes the timestamp (matched by datepattern below) BEFORE
# applying failregex, so this must NOT try to match the date again. A regex
# starting with ^\S+ to "skip the timestamp" matches nothing — and the jail
# still starts cleanly and reports zero hits forever. Always verify with:
#   docker compose exec fail2ban \
#     fail2ban-regex /var/log/wp/auth.log /etc/fail2ban/filter.d/wordpress-auth.conf
failregex = ^\s*wp-auth ip=<HOST> event=(login-failed|xmlrpc-auth-failed)\b
ignoreregex =
# The log has no syslog prefix, so pin the format instead of guessing.
#   %%f  microseconds (see above — required, not cosmetic)
#   %%z  the timezone, which the mu-plugin writes as a trailing "Z" for UTC
#
# %%z is essential and easy to get wrong: writing it as a literal "Z" instead
# makes fail2ban parse the timestamp as NAIVE LOCAL time. With the container on
# a +03:00 zone that puts every entry three hours in the past, past findtime, so
# fail2ban discards all of them with "Ignoring all log entries older than 600s"
# — the jail runs, matches the regex, and still never bans anyone.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S.%%f%%z
