# Brute-force protection for WordPress logins.
#
# Nothing else in this stack rate-limits authentication: Apache serves
# wp-login.php like any other page and WordPress has no lockout of its own, so
# an attacker can try passwords as fast as the network allows, indefinitely.
#
# THIS FILE IS THE TUNING SURFACE. It is bind-mounted, so edit it here and
# restart the service — no rebuild, and the values are not driven from .env
# (fail2ban does not interpolate environment variables into jails):
#   docker compose restart fail2ban

[DEFAULT]
# Never ban these. PUT YOUR OWN OFFICE / VPN / HOME ADDRESS HERE before you
# enable the jail — a forgotten password should not lock you out of your own
# site, and it will be your own IP that trips the counter first.
ignoreip = 127.0.0.1/8 ::1

# Escalate repeat offenders instead of releasing them on the same timer: each
# further ban of the same address lasts twice as long, up to a week.
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1w

[wordpress-auth]
enabled = true
# Written by wordpress/mu-plugins/fail2ban-auth-log.php, mounted read-only.
logpath = /var/log/wp/auth.log
filter = wordpress-auth

# Poll the file rather than relying on inotify. The log lives on a Docker
# volume shared between two containers; polling is a few reads a second and
# removes a whole class of "the jail is up but never matches anything" bugs.
backend = polling

# 5 failures within 10 minutes -> 1 hour ban. Deliberately forgiving: a real
# person mistyping a password a few times must not be locked out, while a
# script trying thousands of passwords is stopped almost immediately.
maxretry = 5
findtime = 10m
bantime = 1h

# Ban in DOCKER-USER, not INPUT — see fail2ban/action.d/docker-user.conf for
# why the stock actions silently do nothing for container traffic.
action = docker-user[name=wordpress-auth]
